{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Change Password - IntegriPic{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="main-content">
            <div class="text-center mb-4">
                <div class="stat-icon blue mx-auto mb-3" style="width:52px;height:52px;font-size:1.4rem;"><i class="bi bi-key"></i></div>
                <h2 class="fw-bold">Change Password</h2>
                <p class="text-muted">Update your account password</p>
            </div>
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <div class="d-grid gap-2 mt-3">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-circle me-1"></i> Change Password
                    </button>
                </div>
            </form>
            <div class="text-center mt-4">
                <a href="{% url 'accounts:profile' %}" class="text-decoration-none text-muted" style="font-size:0.875rem;">
                    <i class="bi bi-arrow-left me-1"></i>Back to Profile
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
