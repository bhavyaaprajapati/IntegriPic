{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Reset Password - IntegriPic{% endblock %}
{% block content %}
<div class="text-center mb-4">
    <div class="stat-icon yellow mx-auto mb-3" style="width:52px;height:52px;font-size:1.4rem;"><i class="bi bi-key"></i></div>
    <h2 class="fw-bold" style="color:#f1f5f9;">Reset Your Password</h2>
    <p style="color:#94a3b8;">Enter your email and we'll send you a reset link</p>
</div>
<div class="main-content">
    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <div class="d-grid gap-2 mt-3">
            <button type="submit" class="btn btn-warning text-dark fw-semibold">
                <i class="bi bi-envelope me-1"></i> Send Reset Link
            </button>
        </div>
    </form>
    <div class="text-center mt-4">
        <a href="{% url 'accounts:login' %}" class="text-decoration-none text-muted" style="font-size:0.875rem;">
            <i class="bi bi-arrow-left me-1"></i>Back to login
        </a>
    </div>
</div>
{% endblock %}
