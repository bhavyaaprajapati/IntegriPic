{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block title %}Register - IntegriPic{% endblock %}

{% block content %}
<div class="card p-4 p-md-5 border-0 shadow-lg">
    <div class="text-center mb-5">
        <div class="mx-auto mb-4 d-flex align-items-center justify-content-center" style="width: 72px; height: 72px; background: rgba(59, 130, 246, 0.1); border-radius: 20px; color: var(--primary-blue); font-size: 2.2rem; border: 1px solid rgba(59,130,246,0.2);">
            <i class="bi bi-person-plus-fill"></i>
        </div>
        <h3 class="fw-bolder mb-2 text-body">Create Profile</h3>
        <p class="text-muted" style="font-size: 0.95rem;">Enroll in the forensic analysis pipeline</p>
    </div>

    <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <div class="d-grid mt-4 pt-3">
            <button type="submit" class="btn btn-primary btn-lg fw-bold rounded-3" style="padding: 14px;">
                Complete Registration
            </button>
        </div>
    </form>

    <div class="text-center mt-5 pt-2">
        <p class="text-muted mb-0" style="font-size: 0.9rem;">
            Already have an account?
            <a href="{% url 'accounts:login' %}" class="text-decoration-none fw-semibold text-primary">Sign in here</a>
        </p>
    </div>
</div>
<style>
.form-group { margin-bottom: 1.5rem; }
label { font-weight: 600; font-size: 0.85rem; margin-bottom: 0.5rem; display: block; color: var(--bs-body-color); }
.form-control { padding: 12px 16px !important; font-size: 1rem !important; border-radius: 10px !important; }
</style>
{% endblock %}
